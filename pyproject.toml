# pyproject.toml: Repository-root Python project for the attendee-facing application.
# Declares the LeRobot fork (LeKiwi client + Rerun viewer) and pyserial for the
# dino-controller so `uv` can build one environment; the app is not packaged.

[project]
name = "dino-egg-catch-challenge"
version = "0.1.0"
description = "Dino Egg Catch Challenge application: Drive Mode teleoperation for LeKiwi."
requires-python = ">=3.12"
dependencies = ["lerobot[lekiwi,viz]", "pyserial>=3.5", "pygame-ce>=2.5"]

[tool.uv]
package = false

[tool.uv.sources]
lerobot = { path = "../lerobot-dino-egg-catch-challenge", editable = true }
